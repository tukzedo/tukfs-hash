## The pipeline's Python, typed in full. Same Python as cicd/ruff.toml's
## target-version.
[mypy]
python_version = 3.11
strict = True
warn_unreachable = True

## Pillow comes with its types, but mypy's own install often can't see the
## interpreter's site-packages.
[mypy-PIL.*]
ignore_missing_imports = True
