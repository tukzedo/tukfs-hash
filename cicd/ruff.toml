## The pipeline's own Python, from shclwrap's. 4 spaces, and no line limit,
## so 320, ruff's max.
line-length = 320
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ANN", "PTH", "BLE", "S110", "PERF", "RUF"]
## SIM108 wants a long if/else as a one-line ternary, which reads worse.
ignore = ["SIM108"]
